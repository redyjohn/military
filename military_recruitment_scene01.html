<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>國軍志願士兵｜MISSION 01</title>
<style>
:root{--bg:#07100d;--fg:#eef4ed;--muted:#9aa9a0;--accent:#b7d45b;--line:#30423a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,"Noto Sans TC",sans-serif}
body{overflow:hidden}.scene{height:100vh;width:100vw;position:relative;display:grid;place-items:center;overflow:hidden}
.grid{position:absolute;inset:0;background:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:70px 70px;opacity:.14;transform:perspective(500px) rotateX(58deg) scale(1.5);transform-origin:center bottom}
.scan{position:absolute;width:100%;height:2px;background:var(--accent);box-shadow:0 0 22px var(--accent);top:-4px;animation:scan 4s linear infinite}
@keyframes scan{to{top:100%}}
.content{position:relative;z-index:2;text-align:center;max-width:1000px;padding:40px}
.kicker{font-size:14px;letter-spacing:.35em;color:var(--accent);margin-bottom:24px}
h1{font-size:clamp(52px,9vw,120px);line-height:.95;margin:0;font-weight:800;letter-spacing:-.05em}
.subtitle{font-size:clamp(18px,2.5vw,30px);color:var(--muted);margin-top:26px}
.line{height:1px;background:var(--accent);width:180px;margin:34px auto}
.prompt{font-size:18px;color:#cbd6cf}
#hud{position:fixed;left:28px;top:24px;z-index:10;font-size:12px;letter-spacing:.18em;color:var(--muted)}
#hud b{color:var(--accent)}#next{position:fixed;right:28px;bottom:24px;z-index:10;color:var(--muted);font-size:12px;letter-spacing:.18em}
.mission{opacity:0;transform:translateY(50px) scale(.96);transition:1.1s cubic-bezier(.2,.8,.2,1)}
.mission.show{opacity:1;transform:none}
.cards{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:40px}
.card{width:180px;border:1px solid var(--line);padding:22px 18px;text-align:left;background:rgba(8,18,14,.72);transition:.4s}
.card:hover{border-color:var(--accent);transform:translateY(-8px)}
.num{font-size:12px;color:var(--accent);letter-spacing:.18em}.card h2{font-size:20px;margin:12px 0 8px}.card p{color:var(--muted);font-size:13px;line-height:1.6;margin:0}
.flash{animation:flash 1s ease}.complete{color:var(--accent);font-size:14px;letter-spacing:.3em;margin-top:28px}
@keyframes flash{0%,100%{opacity:1}50%{opacity:.25}}
</style>
</head>
<body>
<div id="hud">ARMED FOR PRESENTATION · <b>MISSION 01</b></div>
<div id="next">SCROLL / ↓ TO CONTINUE</div>

<section class="scene" id="hero">
  <div class="grid"></div><div class="scan"></div>
  <div class="content">
    <div class="kicker mission">國軍志願士兵｜HIGH SCHOOL RECRUITMENT</div>
    <h1 class="mission">你的下一步<br>由你決定</h1>
    <div class="line mission"></div>
    <div class="subtitle mission">如果你正在思考高中畢業後的下一站<br>先來認識這一條路。</div>
    <div class="prompt mission">PRESS ↓ / SPACE</div>
  </div>
</section>

<section class="scene">
  <div class="grid"></div>
  <div class="content">
    <div class="kicker mission">START YOUR MISSION</div>
    <h1 class="mission">不是現在決定<br>而是先了解</h1>
    <div class="cards">
      <div class="card mission"><div class="num">01</div><h2>符合嗎？</h2><p>先檢查甄選條件。</p></div>
      <div class="card mission"><div class="num">02</div><h2>怎麼報？</h2><p>了解報名流程。</p></div>
      <div class="card mission"><div class="num">03</div><h2>待遇？</h2><p>看看服役期間待遇。</p></div>
      <div class="card mission"><div class="num">04</div><h2>注意什麼？</h2><p>避開報名常見地雷。</p></div>
    </div>
    <div class="complete mission">MISSION 01 · READY</div>
  </div>
</section>

<script>
let sections=[...document.querySelectorAll('.scene')],i=0,locked=false;
function reveal(){
  sections.forEach((s,n)=>s.querySelectorAll('.mission').forEach((e,j)=>e.classList.toggle('show',n===i)));
}
function go(d){
  if(locked)return;
  let ni=Math.max(0,Math.min(sections.length-1,i+d)); if(ni===i)return;
  locked=true;i=ni;reveal();setTimeout(()=>locked=false,900);
}
addEventListener('wheel',e=>go(e.deltaY>0?1:-1),{passive:true});
addEventListener('keydown',e=>{if(['ArrowDown','PageDown',' '].includes(e.key))go(1);if(['ArrowUp','PageUp'].includes(e.key))go(-1)});
reveal();
</script>
</body>
</html>
